name: "Diagnostic Windows symbols"

on:
  push:
    branches:
      - "diag/stack-symbols-8b755329-20260917"
  workflow_dispatch:

jobs:
  windows-symbols:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8b7553292433684cb3b8749f1334bfcd302cf9e4

      - name: Cache Rust and bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            node_modules
          key: windows-latest-iloader-${{ hashFiles('**/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            Windows-iloader-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make for Windows
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      - name: Clean old bundles
        run: bunx rimraf src-tauri/target/release/bundle

      - name: Build exact source
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/ci.conf.json

      - name: Show exact hashes
        shell: pwsh
        run: |
          Get-FileHash src-tauri/target/release/iloader.exe -Algorithm SHA256
          Get-FileHash src-tauri/target/release/iloader.pdb -Algorithm SHA256

      - name: Upload exact Windows exe and PDB
        uses: actions/upload-artifact@v7
        with:
          name: windows-symbols-8b755329
          path: |
            ${{ github.workspace }}/src-tauri/target/release/iloader.exe
            ${{ github.workspace }}/src-tauri/target/release/iloader.pdb
